name: Build Project (for Launchpad PPA)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Install required packages
        run: |
          sudo rm /etc/apt/sources.list.d/microsoft-prod.list
          sudo add-apt-repository -y ppa:eofla/adt
          sudo NEEDRESTART_SUSPEND=1 apt update
          sudo NEEDRESTART_SUSPEND=1 apt install devscripts debhelper-compat dput build-essential equivs
          sudo NEEDRESTART_SUSPEND=1 mk-build-deps -i
          rm *build-deps*
          mv pyproject.toml pyproject.new.toml
          mv pyproject-olderpy.toml pyproject.toml
        
      - name: Make original package
        run: |
          mv debian ..
          mv .github ..
          tar cfv ../adt_1.3.0.0.orig.tar .
          xz ../adt_1.3.0.0.orig.tar
          mv ../debian .

      - name: Try to build
        run: |
          sudo ip netns add no-net
          sudo ip netns exec no-net debuild --no-lintian -us -uc
